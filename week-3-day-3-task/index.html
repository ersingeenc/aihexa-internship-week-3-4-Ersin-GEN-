<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eğitim Kayıt Formu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-kutusu">

        <h1>Eğitim Kayıt Formu</h1>

        <form id="egitimFormu">

            <label for="ad">Ad</label>
            <input
                type="text"
                id="ad"
                placeholder="Adınızı giriniz"
                required
            >

            <label for="soyad">Soyad</label>
            <input
                type="text"
                id="soyad"
                placeholder="Soyadınızı giriniz"
                required
            >

            <label for="email">E-posta</label>
            <input
                type="email"
                id="email"
                placeholder="ornek@mail.com"
                required
            >

            <label for="telefon">Telefon</label>
            <input
                type="tel"
                id="telefon"
                placeholder="05xx xxx xx xx"
                required
            >

            <label for="egitim">Eğitim Seçimi</label>
            <select id="egitim" required>
                <option value="">Eğitim seçiniz</option>
                <option value="Java Full Stack Eğitimi">
                    Java Full Stack Eğitimi
                </option>
                <option value="React Eğitimi">
                    React Eğitimi
                </option>
                <option value="Web Tasarım Eğitimi">
                    Web Tasarım Eğitimi
                </option>
            </select>

            <label for="seviye">Eğitim Seviyesi</label>
            <select id="seviye" required>
                <option value="">Seviye seçiniz</option>
                <option value="Başlangıç">Başlangıç</option>
                <option value="Orta">Orta</option>
                <option value="İleri">İleri</option>
            </select>

            <label for="aciklama">Açıklama</label>
            <textarea
                id="aciklama"
                rows="4"
                placeholder="Eğitim hakkındaki açıklamanızı yazınız"
            ></textarea>

            <div class="kvkk-alani">
                <input type="checkbox" id="kvkk" required>

                <label for="kvkk">
                    KVKK metnini okudum ve kabul ediyorum.
                </label>
            </div>

            <button type="submit">Kaydı Gönder</button>

        </form>

        <div id="sonucAlani" class="sonuc-alani">
            <h2>Backend'e Gönderilecek JSON</h2>
            <pre id="jsonSonucu">Form henüz gönderilmedi.</pre>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6. Hafta Frontend Çalışması</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container py-5">
  <h1>6. Hafta Frontend Çalışması</h1>

  <form id="demoForm" class="mt-4 needs-validation" novalidate>
    <fieldset>
      <legend>Stajyer Bilgileri</legend>

      <div class="mb-3">
        <label class="form-label">Ad Soyad</label>
        <input class="form-control" name="name" autocomplete="name" required>
        <div class="invalid-feedback">Bu alan zorunludur.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Dosyalar</label>
        <input class="form-control" type="file" multiple>
      </div>

      <button class="btn btn-primary" type="submit">Kaydet</button>
      <div id="message" class="mt-3"></div>
    </fieldset>
  </form>

  <div class="responsive-card mt-5">
    <h2>Responsive Kart</h2>
    <p>clamp(), aspect-ratio ve object-fit örneği.</p>
    <img src="https://picsum.photos/800/450" alt="Örnek görsel">
  </div>

  <div class="dropdown mt-4">
    <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Seçenekler</button>
    <ul class="dropdown-menu">
      <li><a class="dropdown-item" href="#">Profil</a></li>
      <li><a class="dropdown-item" href="#">Ayarlar</a></li>
    </ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
